# Simple Redis-backed Nchan configuration

upstream redis_backend {
    nchan_redis_server redis:6379;
}

server {
    listen 8081;
    server_name redis-simple;
    
    # Redis connection
    nchan_redis_pass redis_backend;
    
    # Simple Redis-backed publisher
    location ~ /redis-pub/(.*)$ {
        nchan_publisher;
        nchan_channel_id $1;
        nchan_store_messages on;
        nchan_message_buffer_length 50;
        nchan_message_timeout 1h;
    }
    
    # Simple Redis-backed subscriber  
    location ~ /redis-sub/(.*)$ {
        nchan_subscriber;
        nchan_channel_id $1;
        nchan_subscriber_first_message oldest;
    }
    
    # Health check for this server
    location /redis-health {
        return 200 "Redis backend OK\n";
        add_header Content-Type text/plain;
    }
}