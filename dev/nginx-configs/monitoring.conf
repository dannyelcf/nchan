# Performance monitoring and debugging configuration
server {
    listen 8083;
    server_name monitoring;
    
    # Comprehensive Nchan status page
    location /status {
        nchan_stub_status;
        access_log off;
    }
    
    # Channel events for debugging
    location ~ /events/(.*)$ {
        nchan_subscriber;
        nchan_channel_group meta;
        nchan_channel_id $1;
    }
    
    # Performance test endpoints
    location ~ /perf-pub/(.*)$ {
        nchan_publisher;
        nchan_channel_id $1;
        nchan_message_buffer_length 1000;
        nchan_message_timeout 1h;
        
        # Enable channel events for this location
        nchan_channel_events_channel_id $1;
        
        access_log /var/log/nginx/perf_publisher.log;
    }
    
    location ~ /perf-sub/(.*)$ {
        nchan_subscriber;
        nchan_channel_id $1;
        nchan_subscriber_first_message newest;
        nchan_subscriber_timeout 300;
        
        access_log /var/log/nginx/perf_subscriber.log;
    }
    
    # Metrics in different formats
    location /metrics/json {
        nchan_stub_status;
        add_header Content-Type application/json;
    }
    
    location /metrics/prometheus {
        # Custom location for Prometheus-style metrics
        # This would need additional configuration/scripting
        return 200 "# Nchan metrics endpoint - implement with custom script\n";
        add_header Content-Type text/plain;
    }
}