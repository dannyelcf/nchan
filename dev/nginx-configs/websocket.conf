# WebSocket-specific configuration
server {
    listen 8082;
    server_name websocket-server;
    
    # WebSocket publisher/subscriber
    location ~ /ws/(.*)$ {
        nchan_pubsub websocket;
        nchan_channel_id $1;
        nchan_message_buffer_length 20;
        nchan_message_timeout 2m;
        
        # WebSocket-specific settings
        nchan_websocket_ping_interval 30s;
        nchan_websocket_client_heartbeat ping pong;
    }
    
    # EventSource (SSE) endpoint
    location ~ /sse/(.*)$ {
        nchan_subscriber eventsource;
        nchan_channel_id $1;
        nchan_subscriber_first_message oldest;
        
        # EventSource-specific settings
        nchan_eventsource_ping_interval 30s;
        nchan_eventsource_ping_data "ping";
        nchan_eventsource_ping_event "heartbeat";
    }
    
    # Channel multiplexing example
    location ~ /multi/(.*)$ {
        nchan_subscriber;
        nchan_channel_id_split_delimiter ",";
        nchan_channel_id $1;
        nchan_subscriber_first_message newest;
    }
}