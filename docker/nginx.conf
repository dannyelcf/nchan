user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Nchan shared memory
    nchan_shared_memory_size 128M;
    
    # Redis configuration
    upstream redis_cluster {
        nchan_redis_server redis://redis:6379;
    }

    # Basic pub/sub endpoints for testing
    server {
        listen 80;
        server_name localhost;
        
        # Publisher endpoint
        location ~ /pub/(.*)$ {
            nchan_publisher;
            nchan_channel_id $1;
            nchan_message_buffer_length 50;
            nchan_message_timeout 5m;
        }
        
        # Subscriber endpoint
        location ~ /sub/(.*)$ {
            nchan_subscriber;
            nchan_channel_id $1;
            nchan_subscriber_first_message oldest;
        }
        
        # Combined pub/sub endpoint
        location ~ /pubsub/(.*)$ {
            nchan_pubsub;
            nchan_channel_id $1;
            nchan_message_buffer_length 50;
            nchan_message_timeout 5m;
        }
        
        # WebSocket endpoint
        location ~ /ws/(.*)$ {
            nchan_pubsub;
            nchan_channel_id $1;
            nchan_subscriber websocket;
            nchan_websocket_ping_interval 5s;
            nchan_message_buffer_length 50;
            nchan_message_timeout 5m;
        }
        
        # Channel statistics
        location ~ /stats/(.*)$ {
            nchan_publisher;
            nchan_channel_id $1;
        }
        
        # Nchan status page
        location /nchan_stats {
            nchan_stub_status;
        }
        
        # Static content for testing
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
    
    # Redis-backed server on port 8081
    server {
        listen 8081;
        server_name localhost;
        
        # Redis publisher endpoint
        location ~ /redis-pub/(.*)$ {
            nchan_publisher;
            nchan_channel_id $1;
            nchan_message_buffer_length 200;
            nchan_message_timeout 10m;
            nchan_redis_pass redis_cluster;
        }
        
        # Redis subscriber endpoint
        location ~ /redis-sub/(.*)$ {
            nchan_subscriber;
            nchan_channel_id $1;
            nchan_subscriber_first_message oldest;
            nchan_redis_pass redis_cluster;
        }
        
        # Redis pubsub endpoint
        location ~ /redis-pubsub/(.*)$ {
            nchan_pubsub;
            nchan_channel_id $1;
            nchan_message_buffer_length 200;
            nchan_message_timeout 10m;
            nchan_redis_pass redis_cluster;
        }
        
        # Redis health check
        location /redis-health {
            return 200 "Redis backend OK\n";
            add_header Content-Type text/plain;
        }
        
        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
    
    # WebSocket server on port 8082
    server {
        listen 8082;
        server_name localhost;
        
        # WebSocket pub/sub endpoint
        location ~ /ws/(.*)$ {
            nchan_pubsub;
            nchan_channel_id $1;
            nchan_subscriber websocket;
            nchan_websocket_ping_interval 5s;
            nchan_message_buffer_length 50;
            nchan_message_timeout 5m;
        }
        
        # WebSocket subscriber-only endpoint
        location ~ /sub/websocket_only/(.*)$ {
            nchan_subscriber websocket;
            nchan_channel_id $1;
            nchan_websocket_ping_interval 5s;
        }
        
        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
    
    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}